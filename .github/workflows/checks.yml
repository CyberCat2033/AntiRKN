name: Checks

# Pull requests and pushes: full verification plus non-secret builds of all
# three platforms. No secrets, no pull_request_target; fork pull requests get
# a placeholder Google Project ID because repository variables may be absent.

on:
  push:
    branches: ['**'] # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        shell: bash
        run: bash tool/ci/setup_flutter.sh 3.41.2 90673a4eef275d1a6692c26ac80d6d746d41a73a

      - name: Changelog has an [Unreleased] section
        run: python3 tool/ci/changelog_check.py --unreleased --soft

      - name: Fonts for layout tests
        run: bash tool/ci/test_fonts.sh "$(dirname "$(dirname "$(command -v flutter)")")"

      # Runner tests require root-owned files: run as uid 0 inside a user
      # namespace (as locally), which Ubuntu 24.04 AppArmor blocks by default.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Verify domain, templates, translations and UI
        env:
          TAR_OPTIONS: --no-same-owner # uid 0 in the namespace must not chown extracted files
        run: unshare -r bash tool/verify.sh

  build:
    name: Build
    # Builds are heavy: pull requests, the default branch and manual runs only.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/build.yml
    with:
      mode: check
      cache: true
      retention-days: 7
